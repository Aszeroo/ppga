name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
  checks: write
concurrency:
  group: ci-${github.workflow}-${github.ref}
  cancel-in-progress: true
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # Real-database tests are guarded by SUP_* env presence; CI passes without secrets.
      # Secrets live only as environment secrets on the Vercel/Supabase project, never committed here.